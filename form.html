<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formulario</title>
        <link rel="stylesheet" href="form.css">
    </head>
    <body>
        <form action="resultados.php" method="get">
            <p>
                <label>Asignatura</label>
                <br/>
                <input type="radio" name="asignatura" id="servidor" value="servidor"/>

                <br/>
                <input type="radio" name="asignatura" id="cliente" value="cliente"/>
                <label for="cliente">Cliente</label>
                <br/>
                <input type="radio" name="asignatura" id="depsliegue" value="despliegue"/>

            <p>
                <label>Profesor</label>

                <input type="checkbox" name="profesor[]" id="isa" value="isa"/>

                <br/>

            <p>
                <label>Información</label>

                <textarea name="info"></textarea>
            </p>
            <p>
                <input type="submit"/>
            </p>
        </form>

</html>
